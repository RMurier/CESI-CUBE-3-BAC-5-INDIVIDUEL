name: CodeQL

on:
  push:
    branches: [develop, uat, master]
  pull_request:
    branches: [develop, uat, master]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  # Même logique que "changes" dans pipeline.yml : sur une PR, n'analyse que le langage dont les
  # fichiers ont changé (évite p. ex. l'analyse csharp sur un bump npm). Sur push/schedule, inchangé.
  changes:
    name: Détection des fichiers modifiés
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # paths-filter calcule un diff via git localement (sur push, il n'y a pas de PR dont l'API
      # fournirait la liste des fichiers) : il faut donc un checkout avec historique, pas seulement
      # le dernier commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/services/**'
              - 'src/shared/**'
              - 'src/Collector.sln'
              - 'src/Directory.Build.props'
              - '.runsettings'
              - 'global.json'
            frontend:
              - 'src/frontend/web/**'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: >
      github.event_name != 'pull_request' ||
      (matrix.language == 'csharp' && needs.changes.outputs.backend == 'true') ||
      (matrix.language == 'javascript-typescript' && needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
