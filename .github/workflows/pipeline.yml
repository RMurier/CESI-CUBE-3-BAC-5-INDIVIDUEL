name: CI/CD

# Pipeline unique, en jobs séparés par type d'étape :
#   test-backend-unit ────┐
#   test-backend-integration ─┼──→ sonar (needs les deux ci-dessus) ─┐
#   test-frontend ─────────┤                                          ├──→ build-and-push ──→ deploy-*
#   vulnerabilities ───────┘                                          ┘
# test-backend-unit/test-backend-integration/test-frontend/vulnerabilities tournent en parallèle
# (aucune dépendance entre eux) — unitaires (logique pure, [Trait("Category","Unit")]) et intégration
# (WebApplicationFactory + vraie SQL Server via Testcontainers, [Trait("Category","Integration")])
# sont deux jobs distincts, filtrés via --filter "Category=...", pour isoler clairement quel type de
# test échoue. sonar réutilise son propre cycle restore/build/test (requis par le scanner, qui doit
# encadrer la compilation elle-même) mais needs les deux jobs de tests backend — pas la peine de
# lancer l'analyse Sonar si les tests de base échouent déjà. build-and-push exige que LES CINQ jobs
# de qualité aient réussi (needs), donc un test/scan en échec bloque tout déploiement, pas seulement
# un warning. build-and-push et les 3 jobs de déploiement ne tournent QUE sur push (jamais sur une PR).
#
# develop -> déploiement auto sur dev
# uat     -> déploiement auto sur uat
# master  -> déploiement sur prod, protégé par l'environnement GitHub "production" (reviewers requis,
#            à configurer une fois dans Settings > Environments — pas automatisable depuis ce fichier).
#
# Séparation des secrets : KUBE_CONFIG_B64 et INFISICAL_CLIENT_ID/SECRET (accès au cluster et à
# Infisical, secrets d'infra CI/CD) vivent en secrets de REPO GitHub, pas dans Infisical — les 3
# environnements tournent sur le même cluster physique, donc ce sont des valeurs identiques pour
# dev/uat/prod (pas d'intérêt à les dupliquer en secrets d'environnement, cf. README section 4).
# Infisical ne contient que les secrets APPLICATIFS (Jwt signing key, connection strings SQL,
# RabbitMQ...), jamais lus par ce pipeline : l'Infisical Secrets Operator dans le cluster les
# synchronise lui-même en continu (resyncInterval: 60s, voir templates/infisical-secret.yaml) —
# un changement de valeur dans Infisical est reflété sans redéploiement CI/CD. Le Secret K8s
# `infisical-machine-identity` qui authentifie cet opérateur est lui-même provisionné à chaque
# déploiement via --set ci-dessous (voir templates/infisical-machine-identity.yaml) : changer de
# serveur = changer KUBE_CONFIG_B64, le reste se reconfigure automatiquement au prochain déploiement.
#
# Les 3 jobs de déploiement tournent sur le runner self-hosted installé sur le serveur qui héberge
# le cluster k3s lui-même (pas un runner GitHub-hosted) : l'API Kubernetes est donc jointe en local
# (le KUBE_CONFIG_B64 généré par k3s, avec son 127.0.0.1 par défaut, fonctionne tel quel — pas besoin
# de le pointer vers une IP publique). Les autres jobs restent sur des runners GitHub-hosted.

on:
  pull_request:
    branches: [develop, uat, master]
  push:
    branches: [develop, uat, master]

permissions:
  contents: read
  packages: write

jobs:
  test-backend-unit:
    name: Tests backend (.NET) — unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Collector.sln

      - name: Build
        run: dotnet build src/Collector.sln --no-restore -c Release

      # Logique pure, sans dépendance externe (pas de WebApplicationFactory/Testcontainers) —
      # classes marquées [Trait("Category", "Unit")] (PersonalDataFilterTests,
      # AutomatedModerationRulesTests).
      - name: Test unitaires
        run: dotnet test src/Collector.sln --no-build -c Release --logger "trx" --filter "Category=Unit"

  test-backend-integration:
    name: Tests backend (.NET) — intégration (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Collector.sln

      - name: Build
        run: dotnet build src/Collector.sln --no-restore -c Release

      # Bout en bout via WebApplicationFactory + vraie instance SQL Server éphémère (Testcontainers)
      # — classes marquées [Trait("Category", "Integration")] (AuthEndpointsTests,
      # ShopAndArticleEndpointsTests, ConversationEndpointsTests, SubscriptionAndNotificationEndpointsTests,
      # DecisionsEndpointTests).
      - name: Test intégration
        # --settings .runsettings : exécute les projets de tests séquentiellement (pas 5 instances
        # SQL Server/Testcontainers simultanées sur un runner CI modeste).
        run: dotnet test src/Collector.sln --no-build -c Release --logger "trx" --filter "Category=Integration" --settings .runsettings

  test-frontend:
    name: Tests frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build

  sonar:
    name: Analyse SonarQube (backend + frontend)
    needs: [test-backend-unit, test-backend-integration, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # requis par SonarScanner pour l'analyse des blames/nouveau code

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4 # requis par le scanner Sonar (JVM)
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/web/package-lock.json

      - name: Install dotnet-sonarscanner
        # Pin 10.4.1 (dernière release de la ligne 10.x) : la ligne 11.x a abandonné le support des
        # serveurs SonarQube antérieurs à 2025.1 — ce serveur auto-hébergé est en 10.7 (Community).
        run: dotnet tool install --global dotnet-sonarscanner --version 10.4.1

      - name: Restore (.NET)
        run: dotnet restore src/Collector.sln

      - name: npm ci (frontend)
        working-directory: src/frontend/web
        run: npm ci

      - name: Sonar begin
        # sonar.javascript.lcov.reportPaths : couverture frontend (générée par l'étape Jest
        # ci-dessous) en plus de la couverture .NET (sonar.cs.opencover.reportsPaths) — une seule
        # analyse couvrant backend + frontend, pas deux projets Sonar séparés.
        run: >
          dotnet sonarscanner begin
          /k:"collector-shop"
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.vstest.reportsPaths="**/*.trx"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="src/frontend/web/coverage/lcov.info"
          /d:sonar.exclusions="**/node_modules/**,**/.next/**,**/coverage/**"
          /d:sonar.coverage.exclusions="**/Migrations/**,**/Properties/**,**/*.d.ts,**/__tests__/**,**/*.test.ts,**/*.test.tsx,src/frontend/web/jest.*,src/frontend/web/next.config.ts,src/frontend/web/eslint.config.mjs,src/frontend/web/src/app/layout.tsx"

      # Sonar doit encadrer la compilation + les tests elle-même (begin/end instrumentent le
      # processus) — ce cycle est donc redondant avec test-backend-unit/integration et
      # test-frontend, pas un doublon évitable.
      - name: Build (.NET)
        run: dotnet build src/Collector.sln --no-restore -c Release

      - name: Test (.NET) avec couverture
        # --settings .runsettings : exécution séquentielle, voir test-backend-integration.
        run: >
          dotnet test src/Collector.sln --no-build -c Release
          --logger "trx" --settings .runsettings
          /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

      - name: Test (frontend) avec couverture
        working-directory: src/frontend/web
        run: npm test -- --ci --coverage

      - name: Sonar end
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # "sonarscanner end" envoie juste les résultats au serveur — il ne fait jamais échouer le job
      # sur le statut de la Quality Gate. report-task.txt (écrit par "begin") donne l'URL de la tâche
      # d'analyse ; on l'attend, puis on interroge le vrai statut de la Quality Gate et on échoue
      # explicitement si ce n'est pas "OK".
      - name: Vérifier la Quality Gate Sonar
        shell: bash
        run: |
          set -euo pipefail
          REPORT_FILE=$(find . -name "report-task.txt" | head -1)
          if [ -z "$REPORT_FILE" ]; then
            echo "report-task.txt introuvable — l'analyse Sonar n'a probablement pas tourné."
            exit 1
          fi
          CE_TASK_URL=$(grep '^ceTaskUrl=' "$REPORT_FILE" | cut -d= -f2-)

          STATUS="PENDING"
          for _ in $(seq 1 30); do
            STATUS=$(curl -fsS -u "${{ secrets.SONAR_TOKEN }}:" "$CE_TASK_URL" | jq -r '.task.status')
            echo "Tâche d'analyse Sonar : $STATUS"
            case "$STATUS" in
              SUCCESS|FAILED|CANCELED) break ;;
            esac
            sleep 5
          done

          if [ "$STATUS" != "SUCCESS" ]; then
            echo "L'analyse Sonar elle-même a échoué (status=$STATUS)."
            exit 1
          fi

          ANALYSIS_ID=$(curl -fsS -u "${{ secrets.SONAR_TOKEN }}:" "$CE_TASK_URL" | jq -r '.task.analysisId')
          QG_JSON=$(curl -fsS -u "${{ secrets.SONAR_TOKEN }}:" \
            "${{ secrets.SONAR_HOST_URL }}/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
          QG_STATUS=$(echo "$QG_JSON" | jq -r '.projectStatus.status')
          echo "Quality Gate : $QG_STATUS"

          # Affiche les conditions en échec pour diagnostiquer sans ouvrir le dashboard.
          echo "$QG_JSON" | jq -r '.projectStatus.conditions[]? | select(.status != "OK")
            | "  - \(.metricKey): \(.actualValue) (seuil \(.comparator) \(.errorThreshold)) → \(.status)"'

          # Diagnostic (non bloquant) : bugs de fiabilité et fichiers les moins couverts.
          PROJECT_KEY="collector-shop"
          sonar_get() {
            curl -sS -u "${{ secrets.SONAR_TOKEN }}:" -w '\n%{http_code}' "${{ secrets.SONAR_HOST_URL }}$1"
          }
          echo "::group::Bugs (reliability)"
          OUT=$(sonar_get "/api/issues/search?componentKeys=$PROJECT_KEY&impactSoftwareQualities=RELIABILITY&ps=100" || true)
          echo "HTTP $(echo "$OUT" | tail -1)"
          echo "$OUT" | sed '$d' | jq -r '"total=\(.total)", (.issues[]? | "  [\(.severity)] \(.component | sub("^[^:]*:";""))#L\(.line // "?") \(.rule) — \(.message)")' || true
          echo "::endgroup::"
          OUT=$(sonar_get "/api/issues/search?componentKeys=$PROJECT_KEY&ps=1" || true)
          echo "Toutes issues : HTTP $(echo "$OUT" | tail -1) total=$(echo "$OUT" | sed '$d' | jq -r '.total' || true)"
          echo "::group::Fichiers les moins couverts"
          OUT=$(sonar_get "/api/measures/component_tree?component=$PROJECT_KEY&metricKeys=coverage,uncovered_lines&qualifiers=FIL&metricSort=uncovered_lines&metricSortFilter=withMeasuresOnly&s=metric&asc=false&ps=40" || true)
          echo "HTTP $(echo "$OUT" | tail -1)"
          echo "$OUT" | sed '$d' | jq -r '.components[]? | "  \(.path)  " + ([.measures[] | "\(.metric)=\(.value)"] | join(" "))' || true
          echo "::endgroup::"

          if [ "$QG_STATUS" != "OK" ]; then
            echo "Quality Gate Sonar non respectée (status=$QG_STATUS) — voir le dashboard pour le détail."
            exit 1
          fi

  vulnerabilities:
    name: Scan de vulnérabilités (dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # L'audit NuGet (restore) émet NU1901 (Low) / NU1902 (Moderate) / NU1903 (High) / NU1904
      # (Critical) selon la gravité réelle de chaque CVE. Ne bloquer que High/Critical — Low/Moderate
      # restent des warnings visibles sans bloquer le pipeline (même seuil que npm audit
      # --audit-level=high côté frontend, voir plus bas).
      - name: Restore (.NET) — bloque sur vulnérabilité High/Critical
        # %3B : la CLI dotnet traite ";" comme séparateur entre propriétés -p:, pas comme partie
        # de la valeur — il faut l'encoder pour une liste de codes dans une seule propriété.
        run: dotnet restore src/Collector.sln "-p:WarningsAsErrors=NU1903%3BNU1904"

      - name: NuGet — rapport complet (y compris Low/Moderate, non bloquant)
        run: dotnet list src/Collector.sln package --vulnerable --include-transitive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/frontend/web/package-lock.json

      - name: npm ci (frontend)
        working-directory: src/frontend/web
        run: npm ci

      # --omit=dev : les vulnérabilités de l'outillage de build (Jest, chaîne ESLint/Next via
      # braces/micromatch) ne finissent jamais dans l'image Docker (output: "standalone" n'embarque
      # pas les devDependencies) — le scan de sécurité porte sur ce qui est réellement livré.
      - name: npm audit — dépendances de production
        working-directory: src/frontend/web
        run: npm audit --omit=dev --audit-level=high

  build-and-push:
    name: Build & push images (${{ matrix.service }})
    if: github.event_name == 'push'
    needs: [test-backend-unit, test-backend-integration, test-frontend, sonar, vulnerabilities]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: identity
            dockerfile: src/services/Identity/Identity.Api/Dockerfile
          - service: catalog
            dockerfile: src/services/Catalog/Catalog.Api/Dockerfile
          - service: chat
            dockerfile: src/services/Chat/Chat.Api/Dockerfile
          - service: notification
            dockerfile: src/services/Notification/Notification.Api/Dockerfile
          - service: moderation
            dockerfile: src/services/Moderation/Moderation.Api/Dockerfile
          - service: frontend
            dockerfile: src/frontend/web/Dockerfile
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      registry: ${{ steps.tag.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Déterminer le tag et le registre d'image
        # GHCR exige un nom de repo en minuscules — github.repository_owner garde la casse réelle
        # du compte GitHub (RMurier), donc on le normalise ici plutôt que dans chaque "tags:".
        run: |
          echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tag.outputs.registry }}/collector-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan de vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.tag.outputs.registry }}/collector-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy-dev:
    name: Déploiement dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-and-push
    runs-on: self-hosted
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Déployer sur K3s (namespace collector-dev)
        run: |
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > kubeconfig.yaml
          helm upgrade --install collector infra/helm/collector \
            -f infra/helm/collector/values-dev.yaml \
            --namespace collector-dev --create-namespace \
            --set global.imageTag=${{ needs.build-and-push.outputs.tag }} \
            --set-string infisical.machineIdentity.clientId=${{ secrets.INFISICAL_CLIENT_ID }} \
            --set-string infisical.machineIdentity.clientSecret=${{ secrets.INFISICAL_CLIENT_SECRET }} \
            --kubeconfig kubeconfig.yaml \
            --wait --timeout 5m

  deploy-uat:
    name: Déploiement uat
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    needs: build-and-push
    runs-on: self-hosted
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Déployer sur K3s (namespace collector-uat)
        run: |
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > kubeconfig.yaml
          helm upgrade --install collector infra/helm/collector \
            -f infra/helm/collector/values-uat.yaml \
            --namespace collector-uat --create-namespace \
            --set global.imageTag=${{ needs.build-and-push.outputs.tag }} \
            --set-string infisical.machineIdentity.clientId=${{ secrets.INFISICAL_CLIENT_ID }} \
            --set-string infisical.machineIdentity.clientSecret=${{ secrets.INFISICAL_CLIENT_SECRET }} \
            --kubeconfig kubeconfig.yaml \
            --wait --timeout 5m

  deploy-prod:
    name: Déploiement prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-push
    runs-on: self-hosted
    environment: production # environnement GitHub protégé : reviewers requis (config manuelle)
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Déployer sur K3s (namespace collector-prod)
        run: |
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > kubeconfig.yaml
          helm upgrade --install collector infra/helm/collector \
            -f infra/helm/collector/values-prod.yaml \
            --namespace collector-prod --create-namespace \
            --set global.imageTag=${{ needs.build-and-push.outputs.tag }} \
            --set-string infisical.machineIdentity.clientId=${{ secrets.INFISICAL_CLIENT_ID }} \
            --set-string infisical.machineIdentity.clientSecret=${{ secrets.INFISICAL_CLIENT_SECRET }} \
            --kubeconfig kubeconfig.yaml \
            --wait --timeout 5m
