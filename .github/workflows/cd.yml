name: CD

# develop -> déploiement auto sur dev
# uat     -> déploiement auto sur uat
# master  -> déploiement sur prod, protégé par l'environnement GitHub "production" (reviewers requis,
#            à configurer une fois dans Settings > Environments — pas automatisable depuis ce fichier).
on:
  push:
    branches: [develop, uat, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: identity
            dockerfile: src/services/Identity/Identity.Api/Dockerfile
          - service: catalog
            dockerfile: src/services/Catalog/Catalog.Api/Dockerfile
          - service: chat
            dockerfile: src/services/Chat/Chat.Api/Dockerfile
          - service: notification
            dockerfile: src/services/Notification/Notification.Api/Dockerfile
          - service: moderation
            dockerfile: src/services/Moderation/Moderation.Api/Dockerfile
          - service: frontend
            dockerfile: src/frontend/web/Dockerfile
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Déterminer le tag d'image
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/collector-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan de vulnérabilités de l'image (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/collector-${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy-dev:
    name: Déploiement dev
    if: github.ref == 'refs/heads/develop'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Secrets d'infra CI (kubeconfig) récupérés depuis Infisical (env "dev"), pas dupliqués en
      # GitHub Secrets — seuls INFISICAL_CLIENT_ID/SECRET (machine identity CI) sont bootstrap
      # en GitHub Secrets. Action/version à revérifier contre la doc Infisical actuelle.
      - uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: collector
          env-slug: dev
          export-type: env

      - name: Déployer sur K3s (namespace collector-dev)
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > kubeconfig.yaml
          helm upgrade --install collector infra/helm/collector \
            -f infra/helm/collector/values-dev.yaml \
            --namespace collector-dev --create-namespace \
            --set global.imageTag=${{ needs.build-and-push.outputs.tag }} \
            --kubeconfig kubeconfig.yaml \
            --wait --timeout 5m

  deploy-uat:
    name: Déploiement uat
    if: github.ref == 'refs/heads/uat'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: collector
          env-slug: uat
          export-type: env

      - name: Déployer sur K3s (namespace collector-uat)
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > kubeconfig.yaml
          helm upgrade --install collector infra/helm/collector \
            -f infra/helm/collector/values-uat.yaml \
            --namespace collector-uat --create-namespace \
            --set global.imageTag=${{ needs.build-and-push.outputs.tag }} \
            --kubeconfig kubeconfig.yaml \
            --wait --timeout 5m

  deploy-prod:
    name: Déploiement prod
    if: github.ref == 'refs/heads/master'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # environnement GitHub protégé : reviewers requis (config manuelle)
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - uses: Infisical/secrets-action@v1.0.9
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: collector
          env-slug: prod
          export-type: env

      - name: Déployer sur K3s (namespace collector-prod)
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > kubeconfig.yaml
          helm upgrade --install collector infra/helm/collector \
            -f infra/helm/collector/values-prod.yaml \
            --namespace collector-prod --create-namespace \
            --set global.imageTag=${{ needs.build-and-push.outputs.tag }} \
            --kubeconfig kubeconfig.yaml \
            --wait --timeout 5m
