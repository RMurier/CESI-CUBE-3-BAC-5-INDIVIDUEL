apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: grafana-tls
  dnsNames: [{{ .Values.host | quote }}]
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: [websecure]
  tls: { secretName: grafana-tls }
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      services:
        - { name: grafana, port: 80 }
---
# Port 80 -> redirection permanente vers HTTPS (même principe que l'application, infra/helm/collector/templates/ingressroute.yaml).
# Nom de middleware préfixé : plusieurs charts partagent le namespace collector-monitoring.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-redirect-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`{{ .Values.host }}`)
      kind: Rule
      middlewares:
        - name: grafana-redirect-https
      services:
        - { name: grafana, port: 80 }
