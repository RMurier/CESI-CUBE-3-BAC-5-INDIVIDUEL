apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ .Release.Namespace }}
data:
  datasource.yaml: |
{{ tpl (.Files.Get "files/datasource.yaml") . | indent 4 }}
  dashboard-provider.yaml: |
{{ .Files.Get "files/dashboard-provider.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: {{ .Release.Namespace }}
data:
  alerting-contactpoints.yaml: |
{{ tpl (.Files.Get "files/alerting-contactpoints.yaml") . | indent 4 }}
  alerting-policies.yaml: |
{{ .Files.Get "files/alerting-policies.yaml" | indent 4 }}
  alerting-rules.yaml: |
{{ .Files.Get "files/alerting-rules.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Release.Namespace }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
