apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: collector-monitoring }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: collector-monitoring }
      annotations:
        # Dashboards ou provisioning modifiés dans Git -> le pod redémarre au déploiement suivant.
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      # Grafana n'appelle jamais l'API Kubernetes (datasources : Prometheus + Infisical uniquement) : pas besoin
      # du jeton de ServiceAccount monté par défaut.
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: {{ .Values.image }}
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.infisical.secretName }}, key: GRAFANA_ADMIN_PASSWORD } }
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.infisical.secretName }}, key: GRAFANA_ADMIN_USER, optional: true } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_SERVER_ROOT_URL, value: "https://{{ .Values.host }}" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasource.yaml, subPath: datasource.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yaml, subPath: dashboard-provider.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: alerting, mountPath: /etc/grafana/provisioning/alerting/alerting-contactpoints.yaml, subPath: alerting-contactpoints.yaml }
            - { name: alerting, mountPath: /etc/grafana/provisioning/alerting/alerting-policies.yaml, subPath: alerting-policies.yaml }
            - { name: alerting, mountPath: /etc/grafana/provisioning/alerting/alerting-rules.yaml, subPath: alerting-rules.yaml }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: alerting
          configMap: { name: grafana-alerting }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Grafana n'est joignable que par Traefik.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-from-traefik
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.trafficNamespace }} }
      ports: [{ protocol: TCP, port: 3000 }]
