apiVersion: 1
groups:
  - orgId: 1
    name: collector-infra
    folder: Collector
    interval: 1m
    rules:
      - uid: collector-pod-restarts
        title: "Redémarrages fréquents de pod (CrashLoopBackOff probable)"
        condition: C
        # 0s déclenchait sur le moindre pic transitoire (ex: probe de liveness en échec une fois le
        # temps qu'un pod démarre pendant un rollout normal), relayé vers Omnia à chaque déploiement
        # sans qu'il y ait de vrai CrashLoopBackOff — bruit constaté sur plusieurs déploiements de suite.
        # 5m exige que le seuil reste dépassé en continu avant de notifier (un vrai CrashLoopBackOff
        # persiste largement au-delà, contrairement à un blip de rollout).
        for: 5m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~"collector-.+"}[15m]))
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [3] }
        annotations:
          summary: "{{ $labels.pod }} ({{ $labels.namespace }}) a redémarré plus de 3 fois en 15 minutes."
        labels: {}
