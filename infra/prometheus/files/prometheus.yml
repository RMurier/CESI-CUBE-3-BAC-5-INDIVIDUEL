# Configuration Prometheus. Les expressions entre doubles accolades sont rendues par Helm (tpl) à partir de values.yaml :
# modifier ce fichier puis pousser suffit, le pod redémarre seul (annotation checksum du Deployment).
global:
  scrape_interval: {{ .Values.scrapeInterval }}

scrape_configs:
  # Découverte par annotations : les services .NET (/metrics sur le port 9090, non routé par Traefik)
  # et RabbitMQ (plugin rabbitmq_prometheus, port 15692) s'annoncent avec prometheus.io/scrape + port.
  - job_name: collector-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            {{- range .Values.watchedNamespaces }}
            - {{ . }}
            {{- end }}
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: (.+);(.+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # État Kubernetes (réplicas souhaités/disponibles, HPA, phase des pods, redémarrages) : kube-state-metrics.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]
    honor_labels: true

  # CPU / mémoire RÉELS des conteneurs (cAdvisor, embarqué dans le kubelet de k3s), lus via l'API server.
  # Le CPU rapporté au `requests` est exactement la valeur que le HPA compare à son seuil.
  - job_name: cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    metric_relabel_configs:
      # Cardinalité maîtrisée : uniquement les conteneurs de l'application (pas le reste du cluster).
      - source_labels: [namespace]
        regex: collector-.+
        action: keep
      - source_labels: [container]
        regex: ""
        action: drop
