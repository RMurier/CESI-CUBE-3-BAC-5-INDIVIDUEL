{{- $aspnetEnv := "Production" -}}
{{- if eq .Values.global.environment "dev" -}}
{{- $aspnetEnv = "Development" -}}
{{- else if eq .Values.global.environment "uat" -}}
{{- $aspnetEnv = "Staging" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "collector.configMapName" . }}
  namespace: {{ .Release.Namespace }}
data:
  ASPNETCORE_ENVIRONMENT: {{ $aspnetEnv | quote }}
  # Service discovery K8s natif : DNS court = <nom-du-service>, résolu dans le même namespace.
  RabbitMq__HostName: "collector-rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: "/"
  RabbitMq__ExchangeName: "collector.events"
  Jwt__Issuer: "collector-identity"
  Jwt__Audience: "collector-api"
  # Notification.Api résout les emails via l'endpoint interne d'Identity (SmtpEmailSender).
  Identity__InternalBaseUrl: "http://collector-identity"
  # Requis par Identity/Catalog/Notification.Api (sinon ils lèvent une exception au démarrage,
  # voir Program.cs) — dérivé du domaine déjà défini par environnement (section 4 du README).
  Cors__FrontendOrigin: "https://{{ .Values.global.domain }}"

  {{- if .Values.metrics.enabled }}
  # Active le serveur /metrics des services .NET (prometheus-net) sur un port dédié.
  Metrics__Port: {{ .Values.metrics.port | quote }}
  {{- end }}
