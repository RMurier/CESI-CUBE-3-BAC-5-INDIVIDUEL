{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collector.fullname" (dict "serviceName" $name) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "collector.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  {{- /* Avec un HPA, le nombre de réplicas appartient à l'autoscaler : ne pas le fixer ici (sinon chaque helm upgrade le réinitialise). */}}
  {{- if not (and $svc.hpa $svc.hpa.enabled) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        {{- include "collector.labels" (dict "root" $root "serviceName" $name) | nindent 8 }}
      {{- if and (ne $name "frontend") $root.Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $root.Values.metrics.port | quote }}
      {{- end }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "collector.image" (dict "root" $root "image" $svc.image) }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "collector.configMapName" $root }}
            - secretRef:
                name: {{ include "collector.secretName" $root }}
          {{- if $svc.db }}
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ include "collector.secretName" $root }}
                  key: ConnectionStrings__{{ $name }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $name "frontend" }}/api/health{{ else }}/health/ready{{ end }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ if eq $name "frontend" }}/api/health{{ else }}/health{{ end }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "collector.fullname" (dict "serviceName" $name) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "collector.labels" (dict "root" $root "serviceName" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if and $svc.hpa $svc.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "collector.fullname" (dict "serviceName" $name) }}
  namespace: {{ $root.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "collector.fullname" (dict "serviceName" $name) }}
  minReplicas: {{ $svc.hpa.minReplicas }}
  maxReplicas: {{ $svc.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $svc.hpa.targetCpuUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $svc.hpa.scaleDownStabilizationSeconds | default 120 }}
{{- end }}
{{- end }}
