apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collector-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collector.labels" (dict "root" . "serviceName" "rabbitmq") | nindent 4 }}
spec:
  serviceName: collector-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "collector.labels" (dict "root" . "serviceName" "rabbitmq") | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        # Plugin rabbitmq_prometheus (activé par défaut dans l'image officielle) : profondeur des files, débit.
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
      {{- end }}
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "collector.secretName" . }}
                  key: RabbitMq__UserName
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "collector.secretName" . }}
                  key: RabbitMq__Password
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: collector-rabbitmq
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "collector.labels" (dict "root" . "serviceName" "rabbitmq") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
