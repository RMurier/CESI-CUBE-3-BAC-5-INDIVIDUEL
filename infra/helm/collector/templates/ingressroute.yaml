{{- $root := . -}}
# Nécessite Traefik (déjà fourni par k3s par défaut) + cert-manager avec un ClusterIssuer nommé
# "letsencrypt" installés au niveau cluster (prérequis infra, hors chart). Domaine réel défini par
# environnement dans values-{dev,uat,prod}.yaml (global.domain) — voir README section 4.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: collector-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: collector-tls
  dnsNames:
    - {{ .Values.global.domain | quote }}
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collector
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - websecure
  tls:
    secretName: collector-tls
  routes:
    {{- if .Values.maintenance.allowedCidrs }}
    {{- range $name, $svc := .Values.services }}
    {{- if and $svc.ingress.enabled $svc.maintenance }}
    # Routes /internal/* réservées aux IP autorisées (Airflow) : prioritaires sur la route générale du service.
    - match: Host(`{{ $root.Values.global.domain }}`) && PathPrefix(`{{ $svc.ingress.pathPrefix }}/internal`)
      kind: Rule
      priority: 20
      middlewares:
        - name: collector-maintenance-allow
        - name: collector-strip-{{ $name }}
      services:
        - name: {{ include "collector.fullname" (dict "serviceName" $name) }}
          port: 80
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $name, $svc := .Values.services }}
    {{- if $svc.ingress.enabled }}
    - match: Host(`{{ $root.Values.global.domain }}`) && PathPrefix(`{{ $svc.ingress.pathPrefix }}`)
      kind: Rule
      priority: {{ if eq $svc.ingress.pathPrefix "/" }}1{{ else }}10{{ end }}
      {{- if or (ne $svc.ingress.pathPrefix "/") $svc.ingress.stripPrefix }}
      middlewares:
        {{- if ne $svc.ingress.pathPrefix "/" }}
        # Le frontend (pathPrefix "/") pose déjà ses propres headers (next.config.ts) : pas la
        # peine de les dupliquer ici, seules les API .NET en ont besoin.
        - name: collector-security-headers
        {{- end }}
        {{- if $svc.ingress.stripPrefix }}
        - name: collector-strip-{{ $name }}
        {{- end }}
      {{- end }}
      services:
        - name: {{ include "collector.fullname" (dict "serviceName" $name) }}
          port: 80
    {{- end }}
    {{- end }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.ingress.enabled $svc.ingress.stripPrefix }}
---
# Les API .NET exposent leurs routes à la racine (/auth/login, /articles...) : Traefik retire le
# préfixe de routage (ex. /api/catalog) avant de transmettre la requête.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: collector-strip-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
spec:
  stripPrefix:
    prefixes:
      - {{ $svc.ingress.pathPrefix }}
{{- end }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: collector-redirect-https
  namespace: {{ .Release.Namespace }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Mêmes headers que le frontend (next.config.ts), appliqués aux API .NET qui n'en posent pas
# elles-mêmes. Pas de CSP ici : ces routes ne renvoient que du JSON, jamais de HTML à sandboxer.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: collector-security-headers
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    stsSeconds: 63072000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    customFrameOptionsValue: DENY
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Permissions-Policy: "camera=(), microphone=(), geolocation=()"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collector-http-redirect
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ .Values.global.domain }}`)
      kind: Rule
      middlewares:
        - name: collector-redirect-https
      services:
        - name: {{ include "collector.fullname" (dict "serviceName" "frontend") }}
          port: 80
{{- if .Values.maintenance.allowedCidrs }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: collector-maintenance-allow
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.maintenance.allowedCidrs }}
      - {{ . | quote }}
      {{- end }}
{{- end }}
