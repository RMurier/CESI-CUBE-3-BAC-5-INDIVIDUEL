{{- if .Values.infisical.enabled }}
# Nécessite l'Infisical Secrets Operator installé au niveau cluster (prérequis infra, hors chart).
# Le Secret K8s {{ .Values.infisical.machineIdentitySecretName }} (clientId/clientSecret d'une
# Machine Identity Infisical en Universal Auth) requis par credentialsRef est provisionné par ce
# même chart, voir templates/infisical-machine-identity.yaml — plus de setup manuel par namespace.
#
# secretsScope accepte projectId OU projectSlug (un seul des deux) — on utilise projectId car
# .Values.infisical.projectId contient l'UUID du projet, pas son slug.
# Champs exacts à revérifier contre la version de l'opérateur installée (API CRD évolue vite) —
# voir README section 12, question "Infisical : instance cloud ou auto-hébergée ?".
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ include "collector.secretName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  hostAPI: {{ .Values.infisical.hostApiUrl }}
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectId: {{ .Values.infisical.projectId }}
        envSlug: {{ .Values.infisical.environmentSlug }}
        secretsPath: {{ .Values.infisical.secretsPath }}
      credentialsRef:
        secretName: {{ .Values.infisical.machineIdentitySecretName }}
        secretNamespace: {{ .Release.Namespace }}
  managedSecretReference:
    secretName: {{ include "collector.secretName" . }}
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Orphan
{{- end }}
