# Surcharge pour l'environnement dev. Déployé automatiquement par la CD sur chaque push sur `develop`.
global:
  domain: "dev.collector.romainmurier.com"
  environment: dev
  # imageTag surchargé en ligne de commande par la CI : --set global.imageTag=sha-<git-sha>

sqlServerEdition: Developer

infisical:
  environmentSlug: dev

# En dev, tout tourne en 1 replica, ressources réduites : pas de PodDisruptionBudget.
# Catalog est le SEUL service autoscalé, avec un `requests` CPU volontairement minuscule : le HPA se
# déclenche dès ~35 mSecondes de CPU, ce qui rend la démo de montée en charge (k6, load-tests/)
# visible (1 -> 3 pods) sans saturer le serveur. Ces valeurs ne servent QU'À la démo.
services:
  catalog:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCpuUtilization: 70
      scaleDownStabilizationSeconds: 60
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 250m, memory: 384Mi }
