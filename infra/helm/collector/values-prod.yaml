# Surcharge pour l'environnement prod. Déployé automatiquement par la CD sur chaque push sur
# `master`, mais protégé par l'environnement GitHub "production" (reviewer requis avant que le job
# ne s'exécute réellement).
global:
  domain: "collector.romainmurier.com"
  environment: prod
  # imageTag surchargé en ligne de commande par la CI : --set global.imageTag=<tag-semver>

# ATTENTION : l'édition Developer de SQL Server est gratuite mais NON licenciée pour la production
# (licence Microsoft). Avant un vrai déploiement prod, remplacer par une édition/licence valide
# (Standard/Enterprise avec clé MSSQL_PID, ou migrer ce service vers une offre managée type Azure SQL).
# Valeur laissée à "Developer" pour que le scaffolding reste déployable tel quel — voir README section 12.
sqlServerEdition: Developer

infisical:
  environmentSlug: prod

# requests.cpu alignées sur la même logique que values.yaml (base) : dev/uat/prod partagent le MÊME
# nœud k3s (4 cœurs), donc c'est la somme des requests de TOUTE la machine qui compte pour le
# scheduling, pas l'usage réel par pod. Les anciennes valeurs (200m/150m × replicas:2 sur 3 services)
# réservaient à elles seules 1,9 cœur rien que pour prod — combiné à dev+uat, le 1er déploiement prod
# n'a jamais pu scheduler ses StatefulSet SQL (FailedScheduling: Insufficient cpu). Limits inchangées
# (c'est le vrai plafond en cas de pic de charge, pas la réservation de base).
services:
  identity:
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
  catalog:
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
  chat:
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
  notification:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  moderation:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  frontend:
    replicas: 2
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
