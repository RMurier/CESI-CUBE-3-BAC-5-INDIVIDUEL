# Surcharge pour l'environnement prod. Déployé manuellement (approbation requise, GitHub
# Environment protégé) sur tag `v*`.
global:
  domain: "collector.CHANGE_ME.example.com"
  environment: prod
  # imageTag surchargé en ligne de commande par la CI : --set global.imageTag=<tag-semver>

# ATTENTION : l'édition Developer de SQL Server est gratuite mais NON licenciée pour la production
# (licence Microsoft). Avant un vrai déploiement prod, remplacer par une édition/licence valide
# (Standard/Enterprise avec clé MSSQL_PID, ou migrer ce service vers une offre managée type Azure SQL).
# Valeur laissée à "Developer" pour que le scaffolding reste déployable tel quel — voir README section 12.
sqlServerEdition: Developer

infisical:
  environmentSlug: prod

services:
  identity:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
  catalog:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
  chat:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
  notification:
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  moderation:
    replicas: 1
    resources:
      requests: { cpu: 150m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  frontend:
    replicas: 2
    resources:
      requests: { cpu: 200m, memory: 384Mi }
      limits: { cpu: "1", memory: 768Mi }
